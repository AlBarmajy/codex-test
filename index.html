<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موقع 3D تفاعلي</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 70%);
      }

      #app {
        position: fixed;
        inset: 0;
      }

      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 14px;
        padding: 12px 16px;
        min-width: 220px;
        backdrop-filter: blur(8px);
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 1rem;
        font-weight: 700;
        color: #e2e8f0;
      }

      .hud p {
        margin: 4px 0;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      .value {
        color: #38bdf8;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud">
      <h1>مشهد ثلاثي الأبعاد</h1>
      <p>اضغط في أي مكان لزيادة السرعة.</p>
      <p>السرعة الحالية: <span id="speedValue" class="value">1.00x</span></p>
    </div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

      const app = document.getElementById("app");
      const speedValue = document.getElementById("speedValue");

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x020617, 8, 24);

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 5.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      app.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x60a5fa, 1.1);
      const pointLight = new THREE.PointLight(0xffffff, 1.6);
      pointLight.position.set(4, 5, 6);
      scene.add(ambientLight, pointLight);

      const mainGeometry = new THREE.TorusKnotGeometry(1.2, 0.35, 220, 26);
      const mainMaterial = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        roughness: 0.25,
        metalness: 0.7,
      });
      const knot = new THREE.Mesh(mainGeometry, mainMaterial);
      scene.add(knot);

      const starsGeometry = new THREE.BufferGeometry();
      const starCount = 700;
      const positions = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        positions[i3] = (Math.random() - 0.5) * 30;
        positions[i3 + 1] = (Math.random() - 0.5) * 30;
        positions[i3 + 2] = (Math.random() - 0.5) * 30;
      }

      starsGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starsMaterial = new THREE.PointsMaterial({
        color: 0x93c5fd,
        size: 0.045,
      });
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);

      let speedMultiplier = 1;
      const speedStep = 0.25;
      const maxSpeed = 8;

      const formatSpeed = () => `${speedMultiplier.toFixed(2)}x`;
      speedValue.textContent = formatSpeed();

      window.addEventListener("pointerdown", () => {
        speedMultiplier = Math.min(speedMultiplier + speedStep, maxSpeed);
        speedValue.textContent = formatSpeed();
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const elapsed = clock.getElapsedTime();
        const rotationFactor = speedMultiplier;

        knot.rotation.x = elapsed * 0.45 * rotationFactor;
        knot.rotation.y = elapsed * 0.7 * rotationFactor;
        knot.rotation.z = elapsed * 0.25 * rotationFactor;

        knot.position.y = Math.sin(elapsed * rotationFactor) * 0.35;
        stars.rotation.y = elapsed * 0.015 * rotationFactor;
        stars.rotation.x = elapsed * 0.008 * rotationFactor;

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
